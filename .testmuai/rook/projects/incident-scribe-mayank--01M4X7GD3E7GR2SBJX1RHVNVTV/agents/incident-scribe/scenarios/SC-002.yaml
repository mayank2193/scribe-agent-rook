goal: System is experiencing an issue and performance seems affected. Please assist with this alert.
input_kind: text
acceptance_criteria:
  - statement: The response status or result indicates needs_input state requesting symptom or impact details
    check: regex
    params:
      pattern: needs_input
  - statement: The response states a question asking for clarification on symptom or impact details
    check: llm_judge
  - statement: The response does not state a severity assignment such as S1, S2, or S3
    check: regex
    params:
      pattern: ^((?!\b(S1|S2|S3)\b)[\s\S])*$
  - statement: The response does not include paths for generated customer-note or incident-record artifacts
    check: llm_judge
forbidden:
  - S1
  - S2
  - S3
  - customer-note
  - incident-record
why: >-
  Catches when an unplaceable report incorrectly receives an S1-S3 severity assignment and produces
  downstream artifacts instead of requesting missing information.
